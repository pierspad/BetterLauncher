name: Publish existing release to Google Play

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag (vX.Y.Z or vX.Y.Z-dev.N)
        required: true
        type: string
      track:
        description: Google Play channel
        default: production
        required: true
        type: choice
        options:
          - production
          - beta
      status:
        description: Save a draft or submit the release
        default: completed
        type: choice
        options:
          - draft
          - completed
      changes_not_sent_for_review:
        description: Commit without sending for review (send from Console UI)
        default: false
        type: boolean

permissions:
  contents: read
concurrency:
  group: google-play-publish
  cancel-in-progress: false
jobs:
  publish:
    # A research branch may run CI, but must never publish to Play.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publish-play
        with:
          tag: ${{ inputs.tag }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          changes_not_sent_for_review: ${{ inputs.changes_not_sent_for_review }}
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
