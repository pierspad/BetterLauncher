name: Release

on:
  push:
    branches:
      - main
      - master
      # dev → prerelease vX.Y.Z-dev.N (marcata Pre-release su GitHub, mai Latest)
      - dev
  workflow_dispatch:

# Stable and dev releases share one Play versionCode sequence.
concurrency:
  group: betterlauncher-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    name: Build & Release APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic_release.outputs.release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Decode Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          else
            echo "::error::Missing release signing keystore."
            exit 1
          fi

      - name: Run Semantic Release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: npx semantic-release

  publish-play:
    name: Publish automatically to Google Play
    needs: release
    if: >-
      needs.release.outputs.version != '' &&
      vars.GOOGLE_PLAY_AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: google-play-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publish-play
        with:
          tag: v${{ needs.release.outputs.version }}
          track: ${{ github.ref == 'refs/heads/dev' && 'beta' || 'production' }}
          status: completed
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Summarize automatic Google Play publication
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          PLAY_TRACK: ${{ github.ref == 'refs/heads/dev' && 'beta' || 'production' }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          track = os.environ['PLAY_TRACK']
          repo = os.environ['GITHUB_REPOSITORY']
          summary = (
              f"## Automatic Google Play publication\n\n"
              f"Release [v{version}](https://github.com/{repo}/releases/tag/v{version}) "
              f"was processed automatically for **{track}** after the signed GitHub release.\n\n"
              "This is a job inside the Release workflow: a separate manual workflow run is not required.\n\n"
              "Google review and managed publishing still apply; check the publish log for any Console action required.\n"
          )
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
              output.write(summary)
          PYTHON
