name: Publish to Google Play
description: Upload the signed release AAB using the Google Play Developer API.
inputs:
  tag:
    description: GitHub release tag (stable or dev prerelease)
    required: true
  track:
    description: production or beta (open testing)
    default: beta
  status:
    description: draft or completed
    default: draft
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Google authentication client
      shell: bash
      run: python -m pip install -r scripts/requirements-google-play.txt
    - name: Download the published signed bundle
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]] || { echo 'Choose vX.Y.Z or vX.Y.Z-dev.N'; exit 1; }
        mkdir -p "$RUNNER_TEMP/play-artifact"
        gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
          --pattern betterlauncher-release.aab --dir "$RUNNER_TEMP/play-artifact"
    - name: Publish bundle to selected track
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        PLAY_TRACK: ${{ inputs.track }}
        PLAY_STATUS: ${{ inputs.status }}
      run: |
        python scripts/publish_google_play.py \
          --bundle "$RUNNER_TEMP/play-artifact/betterlauncher-release.aab" \
          --version-name "$RELEASE_TAG" --track "$PLAY_TRACK" --status "$PLAY_STATUS" \
          --metadata-dir fastlane/metadata/android \
          --metadata-locales en-US it-IT ca es-ES
