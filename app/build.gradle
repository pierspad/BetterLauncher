apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Names the build outputs betterlauncher-<buildType>.apk / .aab instead of app-<buildType>.*
base {
    archivesName = 'betterlauncher'
}

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "com.pierspad.betterlauncher"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 127
        versionName project.hasProperty('versionName') ? project.property('versionName').toString() : "1.3.0"

        resourceConfigurations += ["en", "ar", "ca", "de", "es-rES", "es-rUS", "fr", "he", "iw", "hr", "hu", "in", "it", "ja", "nl", "pl", "pt-rBR", "ru-rRU", "sv", "tr", "uk", "zh"]
        testInstrumentationRunner "app.olauncher.FeedbackRegressionInstrumentation"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: "release.keystore"
            def keystoreFile = file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: "release.keystore"
            if (file(keystorePath).exists()) {
                signingConfig signingConfigs.release
            }
            // Semantic release builds before its version-bump commit. Omit that
            // changing Git revision so F-Droid can reproduce the tagged release.
            vcsInfo.include false
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // F-Droid rejects the opaque dependency block embedded in signed APKs.
    dependenciesInfo {
        includeInApk = false
    }

    // Search indexes every shipped translation, including when installed from an AAB.
    bundle {
        language { enableSplit = false }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    namespace 'app.olauncher'

    lint {
        baseline = file("lint-baseline.xml")
        checkReleaseBuilds true
        abortOnError true
        warningsAsErrors true
        // Version availability is advisory and changes independently of this source.
        disable 'GradleDependency', 'AndroidGradlePluginVersion'
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation libs.kotlin.stdlib
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview

    // Biometric / device-credential app lock
    implementation libs.biometric

    // Android lifecycle
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    // Work Manager

    //Material dependency
    implementation libs.material

    // Android SVG rendering
    implementation libs.androidsvg
}